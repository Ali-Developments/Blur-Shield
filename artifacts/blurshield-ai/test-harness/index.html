<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BlurShield — Test Harness</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 16px; }
      #viewer { position: relative; display: inline-block; }
      #viewer img, #viewer video { display: block; max-width: 360px; height: auto; }
      #__bsFaceOverlayLayer { position: absolute; pointer-events: none; top: 0; left: 0; }
      button { margin-top: 12px; padding: 8px 12px; }
    </style>
  </head>
  <body>
    <h3>BlurShield Test Harness</h3>
    <p>Opens the sample image and applies a canvas-based blur overlay on a detected face region.</p>

    <div id="viewer">
      <img id="sampleImage" src="../../photos/WhatsApp Image 2026-07-20 at 8.12.39 PM.jpeg" alt="sample" crossorigin="anonymous">
      <div id="__bsFaceOverlayLayer"></div>
    </div>

    <div>
      <button id="run">Start Blur</button>
      <button id="stop">Stop</button>
    </div>

    <script src="./test-harness.js"></script>
  </body>
</html>
